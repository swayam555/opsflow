spring:
  application:
    name: deployment-service
  datasource:
    url: ${OPSFLOW_DB_URL:jdbc:h2:mem:deployment;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${OPSFLOW_DB_USER:sa}
    password: ${OPSFLOW_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
server:
  port: ${PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info
opsflow:
  internal:
    token: ${OPSFLOW_INTERNAL_TOKEN:opsflow-internal-dev}
  deploy:
    environments: ${OPSFLOW_DEPLOY_ENVIRONMENTS:dev,staging,production}
    # How long a simulated rollout takes
    step-millis: ${OPSFLOW_DEPLOY_STEP_MILLIS:900}
